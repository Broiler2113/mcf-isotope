name: Native learned policy
# Releases are source-only. Do not add game exports or application archives until
# the project owner explicitly resumes application releases.
on:
  workflow_dispatch:
  push:
    paths: ['.gitattributes', 'native/policy/**', 'addons/mcf_policy/**', 'assets/policy/**', 'rl/features.py', 'rl/model.py', 'rl/train.py', 'rl/test_native_policy.py', 'rl/test_action_fastpath.py', 'rl/test_training_fixes.py', 'src/controllers/LearnedController.gd', 'src/replay/MatchAnalyst.gd', 'scenes/**', 'audio/**', 'tools/audio/**', 'src/audio/**', 'src/fx/FxDecals.gd', 'src/resolver/GameActionResolver.gd', 'src/cheats/**', 'src/intents/CheatIntent.gd', 'src/net/**', 'src/sim/**', 'tests/cheats/**', 'tests/ui/run_release_0132.gd', 'tests/mapgen/run_release_0132.gd', 'src/ui/SettingsWindow.gd', 'project.godot', 'tests/audio/run_audio.gd', 'tests/run_source_fixes.gd', 'tests/bench/run_crush_bench.gd', 'src/ui/TerrainTiles.gd', 'src/sim/RandomEvents.gd', 'src/data/MapGen.gd', 'tests/bench/run_audio_bench.gd', 'tests/*native_policy*', 'tests/record_policy_requests.gd', 'tests/bench/run_native_policy.gd', '.github/workflows/native-policy.yml']
  pull_request:
    paths: ['.gitattributes', 'native/policy/**', 'addons/mcf_policy/**', 'assets/policy/**', 'rl/features.py', 'rl/model.py', 'rl/train.py', 'rl/test_native_policy.py', 'rl/test_action_fastpath.py', 'rl/test_training_fixes.py', 'src/controllers/LearnedController.gd', 'src/replay/MatchAnalyst.gd', 'scenes/**', 'audio/**', 'tools/audio/**', 'src/audio/**', 'src/fx/FxDecals.gd', 'src/resolver/GameActionResolver.gd', 'src/cheats/**', 'src/intents/CheatIntent.gd', 'src/net/**', 'src/sim/**', 'tests/cheats/**', 'tests/ui/run_release_0132.gd', 'tests/mapgen/run_release_0132.gd', 'src/ui/SettingsWindow.gd', 'project.godot', 'tests/audio/run_audio.gd', 'tests/run_source_fixes.gd', 'tests/bench/run_crush_bench.gd', 'src/ui/TerrainTiles.gd', 'src/sim/RandomEvents.gd', 'src/data/MapGen.gd', 'tests/bench/run_audio_bench.gd', 'tests/*native_policy*', 'tests/record_policy_requests.gd', 'tests/bench/run_native_policy.gd', '.github/workflows/native-policy.yml']
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
jobs:
  build:
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: linux-x86_64
          - os: windows-2022
            target: windows-x86_64
          - os: macos-15
            target: macos-arm64
          - os: macos-15-intel
            target: macos-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build native policy and stage runtime
        run: python native/policy/build.py --jobs 2
      - name: Verify optional native manifest registration
        run: python native/policy/test_manifest.py
      - name: Validate complete baked audio catalog
        run: python tools/audio/bake_audio.py --check
      - name: Verify missing audio fails validation
        run: python tools/audio/test_catalog.py
      - name: Install Godot 4.7 editor (source-project checks only)
        run: python native/policy/install_godot.py --editor-only
      - name: Import and verify native loading
        run: godot --headless --editor --path . --import
      - name: Verify controller priority, fallback and model selection
        run: godot --headless --path . --script res://tests/run_native_policy.gd -- --require-native
      - name: Verify sound timing, visibility, caps and saved audio settings
        run: godot --headless --path . --script res://tests/audio/run_audio.gd
      - name: Verify lobby, uniform events, solar arrays, rubble caching and neutral cameras
        run: godot --headless --path . --script res://tests/run_source_fixes.gd
      - name: Verify reported gameplay and saved-history fixes
        run: |
          for suite in combat/run_smoke_and_gas combat/run_bodies combat/run_flamethrower vehicles/run_drone_stations vehicles/run_vehicle_rules events/run_match_modes files/run_game_files ui/run_battle_screen ui/run_menus; do
            godot --headless --path . --script "res://tests/$suite.gd" || exit 1
          done
      - name: Verify cheat commands, permissions, saves and network authority
        run: |
          for suite in tests/cheats/run_*.gd; do
            godot --headless --path . --script "res://$suite" || exit 1
          done
          godot --headless --path . --script res://tests/ui/run_release_0132.gd
          godot --headless --path . --script res://tests/mapgen/run_release_0132.gd
          godot --headless --path . --script res://tests/ui/run_console_windows.gd
          godot --headless --path . --script res://tests/ui/run_fix10.gd
          godot --headless --path . --script res://tests/events/run_live_wave_counts.gd
      - name: Install parity dependencies
        run: python -m pip install numpy onnx onnxruntime==1.22.0
      - name: Install CPU PyTorch
        if: runner.os != 'macOS'
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install macOS PyTorch
        if: matrix.target == 'macos-arm64'
        run: python -m pip install torch
      - name: Install Intel macOS parity dependencies
        if: matrix.target == 'macos-x86_64'
        # 2.2.2 is the last Intel Mac wheel; its NumPy bridge requires NumPy 1.x.
        run: python -m pip install torch==2.2.2 "numpy<2"
      - name: Feature and inference parity on real observations
        shell: bash
        run: |
          probe=.cache/native-policy/mcf_policy_probe
          if [ -f .cache/native-policy/Release/mcf_policy_probe.exe ]; then probe=.cache/native-policy/Release/mcf_policy_probe.exe; fi
          python rl/test_native_policy.py --probe "$probe" --extension --report .cache/native-policy/parity.json
      - name: Verify forced-action inference and learner accounting
        if: runner.os == 'Linux'
        run: |
          python -m pip install pyyaml tensorboard psutil
          python rl/test_action_fastpath.py
          python rl/test_training_fixes.py
      - name: Benchmark synchronous small and Giant-board inference
        shell: bash
        run: godot --headless --path . --script res://tests/bench/run_native_policy.gd > .cache/native-policy/benchmark.jsonl
      - name: Stress test real Giant-board combat audio
        shell: bash
        run: godot --headless --path . --script res://tests/bench/run_audio_bench.gd > .cache/native-policy/audio-benchmark.jsonl
      - uses: actions/upload-artifact@v4
        with:
          name: learned-policy-${{ matrix.target }}
          path: |
            .cache/native-policy/parity.json
            .cache/native-policy/benchmark.jsonl
            .cache/native-policy/audio-benchmark.jsonl
          if-no-files-found: error
