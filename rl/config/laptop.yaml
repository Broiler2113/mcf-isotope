# Phase A on the laptop (Apple Silicon). n_envs ≈ performance cores minus two.
# device is where the PPO update runs (rollouts always decide on the CPU). On a CPU the
# update is most of the wall clock — its conv backward is ~60% of a minibatch — so `auto`
# puts it on the Mac's GPU (mps) when that passes a self-check against the CPU at startup,
# and falls back to cpu otherwise; the log says which. Compare speed/update_secs.
# Graduation to Phase B, growing the map pool, or a new curriculum stage = edit the
# branch's config on the dashboard (Apply config → stop, checkpoint, resume) (8.2, 11.3).
device: auto
n_envs: 6
maps:
  - rl/maps/arena_34x26.json
stage: 1
phase: A            # A: scripted AI opponent; B: pool of past checkpoints + pool_ai_fraction scripted
opponent: normal    # Phase A teacher; HARD is the graduation opponent (8.2)
pool_ai_fraction: 0.15
pool_size: 6
round_cap: 10
max_steps: 3000     # env steps per episode before a forced draw (a policy stuck on a free action)
civilians: false
random_events: false
fog: standard
friendly_fire: true
rollout_steps: 512
epochs: 4
minibatch: 64
lr: 0.0003
gamma: 0.99
lam: 0.95
clip: 0.2
ent_coef: 0.01
vf_coef: 0.5
target_kl: 0.03    # an update stops its epochs early once the policy has moved this far (ppo/epochs)
total_steps: 50000000
checkpoint_every: 10
keep_checkpoints: 40   # ~170 MB of weights; 0 keeps every one and a 50M-step run is ~7 GB
eval_every: 20
eval_games: 24
replays_per_checkpoint: 3
map_rotate_matches: 5
seed: 1
torch_threads: 0
