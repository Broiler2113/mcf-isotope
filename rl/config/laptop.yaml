# Phase A on the laptop (Apple Silicon). Godot env processes are the bottleneck, not the
# network: n_envs ≈ performance cores minus two. device: cpu | mps | cuda | auto (cpu is
# the safe default; try mps and compare speed/update_secs on the dashboard).
# Graduation to Phase B, growing the map pool, or a new curriculum stage = edit the
# branch's config on the dashboard (Apply config → stop, checkpoint, resume) (8.2, 11.3).
device: cpu
n_envs: 6
maps:
  - rl/maps/arena_34x26.json
stage: 1
phase: A            # A: scripted AI opponent; B: pool of past checkpoints + pool_ai_fraction scripted
opponent: normal    # Phase A teacher; HARD is the graduation opponent (8.2)
pool_ai_fraction: 0.15
pool_size: 6
round_cap: 10
max_steps: 3000     # env steps per episode before a forced draw (a policy stuck on a free action)
civilians: false
random_events: false
fog: standard
friendly_fire: true
rollout_steps: 512
epochs: 4
minibatch: 64
lr: 0.0003
gamma: 0.99
lam: 0.95
clip: 0.2
ent_coef: 0.01
vf_coef: 0.5
total_steps: 50000000
checkpoint_every: 10
eval_every: 20
eval_games: 24
eval_opponents: [hard]   # HARD only: NORMAL measured the same thing (AIController splits them
                         # on one shot-scoring tiebreak) and HARD is the graduation opponent
replays_per_checkpoint: 3
map_rotate_matches: 5
seed: 1
torch_threads: 0
# --- keeping the machine alive (a branch left alone for a month) ---
keep_checkpoints: 12       # 4 MB each, one every checkpoint_every updates; 0 = keep all
milestone_every: 2000000   # kept forever regardless of the line above
keep_replay_sets: 8
rollout_budget_mb: 2048    # cut a rollout short rather than grow past this
mem_limit_mb: 8192         # trainer + its Godot envs; checkpoint and exit before the OOM killer
max_actors: 0              # arena armies are small enough to enumerate whole
max_candidates: 0
